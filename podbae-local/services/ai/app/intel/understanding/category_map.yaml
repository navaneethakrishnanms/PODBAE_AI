# Apple Podcasts / iTunes category (current and legacy names, case-insensitive) -> taxonomy topic ids.
# Used for the VERIFIED "declared_topics" field (what the publisher says the show is about). Unmapped categories are
# kept in the raw `categories` field but never become topics. Broad parent categories map to no topic: they are too
# vague to be a topic, but still give the show its `category_group`.
version: category-map-v1
groups:   # category -> group (used for balancing the seed and for group-level agreement)
  arts: Arts
  business: Business
  comedy: Comedy
  education: Education
  fiction: Fiction
  government: News
  history: History
  health & fitness: Health & Fitness
  health: Health & Fitness
  kids & family: Kids & Family
  leisure: Leisure
  games & hobbies: Leisure
  music: Music
  news: News
  news & politics: News
  religion & spirituality: Religion & Spirituality
  science: Science
  science & medicine: Science
  society & culture: Society & Culture
  sports: Sports
  sports & recreation: Sports
  technology: Technology
  true crime: True Crime
  tv & film: TV & Film
