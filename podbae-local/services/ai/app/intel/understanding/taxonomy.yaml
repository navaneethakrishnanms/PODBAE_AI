# Fixed topic taxonomy (version taxonomy-v1). Topics in profiles, human labels and evaluation all use these ids.
# group: the Apple-style top-level area (used for group-level agreement).
# description: one sentence embedded by the local e5 model (embedding-similarity topics).
# keywords: curated lexicon. Matching is case-insensitive at word starts; keywords of <= 4 letters must match a
# whole word. A topic is kept only with evidence from >= 2 episodes, or the show description + >= 1 episode.
version: taxonomy-v1.1   # v1.1: generic keywords removed after the Phase 1 trial (see PHASE1_REPORT.md)
topics:
  books_writing:        {label: Books & writing, group: Arts, description: "books, novels, authors, reading, literature and the craft of writing", keywords: [book club, novel, novels, author interview, authors, literature, literary, reading list, poetry, poems, poet, writing craft, publishing, memoir writing, fiction writing, bookish]}
